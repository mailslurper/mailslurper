services:
  mylslurper:
    build: .
    container_name: mylslurper
    ports:
      - "4436:4436"  # Web UI (MailSlurper-compatible)
      - "4437:4437"  # Service REST API for tests/tools
      - "1025:1025"  # SMTPS (implicit TLS)
    volumes:
      - ./data:/app/data  # Persist the SQLite database across restarts
    environment:
      - DB_FILE=/app/data/mailslurper.db
      - AUTH_SCHEME=none
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4437/mailcount"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
