name: Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go tests
        run: go test ./... -race -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript tests
        run: node --test $(find web/static/js -name '*.test.js')
